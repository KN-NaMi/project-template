name: KiCad PR Diff

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.collect.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Find all KiCad .kicad_pro files
        id: collect
        run: |
          FILES=$(find electronics -name "*.kicad_pro")
          echo "Found:"
          echo "$FILES"
          echo "projects=$(printf '%s\n' $FILES | jq -R . | jq -s .)" >> $GITHUB_OUTPUT

  kiri-diff:
    needs: discover-projects
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print project being processed
        run: echo "Processing ${{ matrix.project }}"

      - name: Run Kiri
        uses: hacker-fab/kiri-github-action@v1.2
        with:
          project-file: ${{ matrix.project }}
          kiri-debug: true

      - name: Upload Kiri output
        uses: actions/upload-artifact@v4
        with:
          name: kiri-output-${{ matrix.project }}
          path: ${{ matrix.project }}   # artifacts grouped per board
          if-no-files-found: warn
