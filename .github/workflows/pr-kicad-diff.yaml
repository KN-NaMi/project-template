name: KiCad PR Diff

on:
  pull_request:
    types: [opened, synchronize]

jobs:

  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.collect.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Find all KiCad .kicad_pro files
        id: collect
        run: |
          FILES=$(find electronics -name "*.kicad_pro")
          echo "Found:"
          echo "$FILES"
          JSON=$(printf '%s\n' $FILES | jq -R -s 'split("\n") | map(select(length > 0))' -c)
          echo "projects=$JSON" >> "$GITHUB_OUTPUT"

  kiri-diff:
    needs: discover-projects
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}

    steps: 
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print project path
        run: echo "Processing: ${{ matrix.project }}"

      - name: Run Kiri-Docker
        run: |
          PROJECT="${{ matrix.project }}"
          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Running kiri-docker for $PROJECT"

          docker run --rm \
            -v "$PWD":/project \
            leoheck/kiri:latest \
            kiri-docker /project -k "-p /project/$PROJECT"

          if [ ! -d "$PROJECT_DIR/.kiri" ]; then
            echo "⚠️ No .kiri directory found. Creating empty one."
            mkdir -p "$PROJECT_DIR/.kiri"
          fi

      - name: Upload Kiri output
        uses: actions/upload-artifact@v4
        with:
          name: kiri-output-${{ matrix.project }}
          path: ${{ matrix.project }}/../.kiri
          if-no-files-found: warn
