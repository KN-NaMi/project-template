name: KiCad PR Diff

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  kiri-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            curl git jq opam m4 pkg-config libgtk-3-dev \
            imagemagick xdg-utils libgl1-mesa-dev \
            xvfb xauth x11-apps

      - name: Initialize OPAM
        run: |
          opam init -y --disable-sandboxing
          eval $(opam env)

      - name: Install KiRI dependencies
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/leoheck/kiri/main/install_dependencies.sh)"

      - name: Install KiRI
        run: |
          bash -c "INSTALL_KIRI_REMOTELLY=1; \
            $(curl -fsSL https://raw.githubusercontent.com/leoheck/kiri/main/install_kiri.sh)"

      - name: Set KiRI environment
        run: |
          eval $(opam env)
          echo "KIRI_HOME=$HOME/.local/share/kiri" >> $GITHUB_ENV
          echo "$HOME/.local/share/kiri/submodules/KiCad-Diff/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/kiri/bin" >> $GITHUB_PATH

      - name: Run KiRI for all projects
        run: |
          FILES=$(find electronics -name "*.kicad_pro")
          echo "Found:"
          echo "$FILES"

          for PROJECT in $FILES; do
            DIR=$(dirname "$PROJECT")
            mkdir -p "$DIR/.kiri"

            echo "Running KiRI on: $PROJECT"
            kiri -p "$PROJECT"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiri-output
          path: electronics/**/.kiri
          if-no-files-found: warn
